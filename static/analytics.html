<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapURL Analytics</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 { color: #333; margin-bottom: 24px; text-align: center; }

        .stat-box {
            background: #f0fdf4;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .stat-box h2 { color: #16a34a; font-size: 32px; }
        .stat-box p { color: #888; font-size: 14px; }

        .click-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background-color: #4338ca; }

        .result { display: none; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ SnapURL Analytics</h1>

        <input
            type="text"
            id="codeInput"
            placeholder="Enter short code (e.g. aB3kPz)..."
        />
        <button onclick="getAnalytics()">Get Analytics</button>

        <div class="result" id="result">
            <div class="stat-box">
                <p>Total Clicks</p>
                <h2 id="totalClicks">0</h2>
            </div>
            <p><strong>Original URL:</strong> <span id="originalURL"></span></p>
            <br>
            <p><strong>Recent Clicks:</strong></p>
            <div id="clicksList"></div>
        </div>
    </div>

    <script>
        async function getAnalytics() {
            const code = document.getElementById('codeInput').value;
            if (!code) {
                alert('Please enter a short code');
                return;
            }
            try {
                const response = await fetch(`/analytics/${code}`);
                    if (!response.ok) {
                        throw new Error('Short code not found');
                    }
                    const data = await response.json();
                    document.getElementById('totalClicks').textContent = data.total_clicks;
                    document.getElementById('originalURL').textContent = data.original_url;
                    
                    const clicksList = document.getElementById('clicksList');
                    clicksList.innerHTML = '';
                    data.recent_clicks.forEach(click => {
                        const item = document.createElement('div');
                        item.className = 'click-item';
                        item.textContent = `${new Date(click.clicked_at).toLocaleString()} - ${click.ip_address}`;
                        clicksList.appendChild(item);
                    });
                    document.getElementById('result').style.display = 'block';
                } catch (error) {
                    alert(error.message);
                }

        }
    </script>
</body>
</html>
